<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>白酒 · 食品饮料 半年报问答库</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#ffffff; --line:#e3e6ea; --text:#1b1f24; --muted:#6b7280;
    --brand:#8b1a1a; --brand-soft:#f6ecec; --vec:#2563eb; --bm:#c2410c; --ok:#15803d;
    --chip:#eef2ff; --chip-t:#3730a3;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font:15px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
  header{background:linear-gradient(135deg,#8b1a1a,#5b1220);color:#fff;padding:18px 24px}
  header h1{margin:0;font-size:19px;letter-spacing:.5px}
  header p{margin:4px 0 0;font-size:13px;opacity:.85}
  .wrap{max-width:1180px;margin:0 auto;padding:18px 20px 60px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:16px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  input[type=text]{flex:1;min-width:280px;padding:11px 13px;border:1px solid var(--line);border-radius:9px;font-size:15px;outline:none}
  input[type=text]:focus{border-color:var(--brand)}
  select,button{padding:10px 14px;border-radius:9px;border:1px solid var(--line);background:#fff;font-size:14px;cursor:pointer}
  button.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
  button.primary:disabled{opacity:.55;cursor:not-allowed}
  button.ghost{background:#fff}
  .hint{color:var(--muted);font-size:12.5px;margin-top:8px}
  .examples{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .ex{background:var(--brand-soft);color:#7a1f1f;border:1px solid #f0dcdc;border-radius:20px;padding:5px 12px;font-size:12.5px;cursor:pointer}
  .ex:hover{background:#efdada}
  .meta{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:12.5px;margin-bottom:8px}
  .answer{font-size:15.5px;white-space:pre-wrap}
  .answer .cite{display:inline-block;min-width:18px;text-align:center;color:var(--brand);
                background:var(--brand-soft);border-radius:4px;font-size:12px;padding:0 4px;margin:0 1px;cursor:pointer}
  .grid{display:grid;gap:12px}
  .hit{border:1px solid var(--line);border-radius:10px;background:#fff;padding:12px 14px}
  .hit.active{border-color:var(--brand);box-shadow:0 0 0 3px rgba(139,26,26,.09)}
  .hit .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
  .badge{background:var(--chip);color:var(--chip-t);border-radius:5px;padding:1px 7px;font-size:12px}
  .badge.table{background:#ecfdf5;color:#065f46}
  .score{font-variant-numeric:tabular-nums}
  .score.v{color:var(--vec)} .score.b{color:var(--bm)}
  .snip{margin-top:8px;font-size:13.5px;color:#333;white-space:pre-wrap;max-height:180px;overflow:auto;
        background:#fafbfc;border:1px solid #f0f2f4;border-radius:8px;padding:9px 11px}
  .qhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
  h2{font-size:15px;margin:0 0 10px}
  .cov{font-size:12.5px;color:var(--muted)}
  .kbd{font-family:ui-monospace,Menlo,monospace;background:#f3f4f6;border:1px solid var(--line);border-radius:4px;padding:1px 5px;font-size:12px}
  .spinner{display:inline-block;width:14px;height:14px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;
           animation:spin .8s linear infinite;vertical-align:-2px;margin-right:6px}
  @keyframes spin{to{transform:rotate(360deg)}}
  footer{color:var(--muted);font-size:12.5px;text-align:center;margin-top:24px}
</style>
</head>
<body>
<header>
  <h1>白酒 · 食品饮料 上市公司 <span id="period">2026</span> 年半年报问答库</h1>
  <p id="subtitle">18 家公司 · 向量检索 + BM25 混合召回 · 答案每句带出处，点编号可回到原文</p>
</header>

<div class="wrap">
  <div class="panel">
    <div class="row">
      <input type="text" id="q" placeholder="例如：贵州茅台上半年直销渠道收入是多少？占营业收入多少？" />
      <select id="mode">
        <option value="hybrid">混合召回（向量+BM25）</option>
        <option value="vector">仅向量</option>
        <option value="bm25">仅 BM25</option>
      </select>
      <select id="topk">
        <option value="6">Top 6</option>
        <option value="10">Top 10</option>
        <option value="20">Top 20</option>
      </select>
      <select id="comp"><option value="">全部公司</option></select>
      <select id="year"><option value="">全部年份</option></select>
      <select id="rtype">
        <option value="">年报+半年报</option>
        <option value="年报">仅年报</option>
        <option value="半年报">仅半年报</option>
      </select>
      <label class="hint" style="margin:0"><input type="checkbox" id="rerank" checked style="vertical-align:-1px"> 两段式重排</label>
      <label class="hint" style="margin:0"><input type="checkbox" id="nollm" style="vertical-align:-1px"> 只看召回</label>
      <button class="primary" id="go">提问</button>
    </div>
    <div class="examples" id="examples"></div>
    <div class="hint">
      回车即提问 · 回答模型为本地 <span class="kbd" id="amodel">Qwen3-4B</span>，不联网、不出本机 ·
      关掉「两段式重排」即为纯 RRF 直出的基线行为
    </div>
  </div>

  <div class="panel" id="answerPanel" style="display:none">
    <div class="qhead">
      <h2 id="qtitle"></h2>
      <div class="cov" id="cov"></div>
    </div>
    <div class="meta" id="ameta"></div>
    <div class="answer" id="answer"></div>
  </div>

  <div class="grid" id="hits"></div>
  <footer>语料为 12 家白酒 A 股 2022—2025 年报 + 2024—2026 半年报全文（交易所 / 巨潮官方 PDF）· 全部检索与生成本机完成</footer>
</div>

<script>
const $ = (s) => document.querySelector(s);
const EXAMPLES = [
  "贵州茅台2025年营业收入和净利润分别是多少？同比增速如何？",
  "五粮液2025年末合同负债余额是多少？",
  "泸州老窖2025年毛利率是多少？",
  "山西汾酒2025年省外收入占比是多少？",
  "洋河股份2025年销售费用同比变化多少？",
  "今世缘2025年经销商数量是多少？",
  "舍得酒业2025年白酒产销量分别是多少？",
  "水井坊2026年上半年营业收入同比增速是多少？",
];

const exBox = $("#examples");
EXAMPLES.forEach(t => {
  const b = document.createElement("span");
  b.className = "ex"; b.textContent = t;
  b.onclick = () => { $("#q").value = t; ask(); };
  exBox.appendChild(b);
});

fetch("/api/stats").then(r => r.json()).then(s => {
  $("#subtitle").textContent =
    `${s.n_companies} 家公司 · ${s.n_docs} 份财报 · ${s.n_chunks.toLocaleString()} 个文本块 · 向量 ${s.dim} 维 · 向量+BM25 混合召回 · 每句带出处`;
  const sel = $("#comp");
  s.companies.forEach(c => {
    const o = document.createElement("option"); o.value = c; o.textContent = c; sel.appendChild(o);
  });
  const ys = $("#year");
  (s.years || []).slice().reverse().forEach(y => {
    const o = document.createElement("option"); o.value = y; o.textContent = y + "年"; ys.appendChild(o);
  });
});

function fmt(x, n = 4) { return x == null ? "—" : Number(x).toFixed(n); }

function renderHits(hits) {
  const box = $("#hits"); box.innerHTML = "";
  hits.forEach((h, i) => {
    const card = document.createElement("div");
    card.className = "hit"; card.id = "hit-" + (i + 1);
    card.innerHTML = `
      <div class="top">
        <span class="badge">#${i + 1}</span>
        <span class="badge" title="文本块编号，可用 /api/chunk/${h.id} 取回原文">块${h.id}</span>
        <b>${h.company}</b>${h.code && h.code !== "-" ? `<span>${h.code}</span>` : ""}
        <span class="badge ${h.block_type === "table" ? "table" : ""}">${h.block_type === "table" ? "表格" : "正文"}</span>
        <span>${h.year}年${h.rtype} · ${h.section}${h.page ? ` · 第 ${h.page} 页` : ""}</span>
        ${h.vector == null
          ? ""
          : `<span class="score v">向量 ${fmt(h.vector)}</span><span class="score b">BM25 ${fmt(h.bm25, 2)}</span>`}
      </div>
      <div class="snip">${escapeHtml(h.text)}</div>`;
    box.appendChild(card);
  });
}

function escapeHtml(s) {
  return s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

function renderAnswer(text) {
  return escapeHtml(text).replace(/\[(\d{1,2})\]/g,
    (m, n) => `<span class="cite" data-i="${n}">${n}</span>`);
}

$("#hits").addEventListener("click", e => {
  const c = e.target.closest(".cite");
  if (!c) return;
  const el = document.getElementById("hit-" + c.dataset.i);
  if (el) {
    document.querySelectorAll(".hit").forEach(x => x.classList.remove("active"));
    el.classList.add("active");
    el.scrollIntoView({ behavior: "smooth", block: "center" });
  }
});

let busy = false;
async function ask() {
  const q = $("#q").value.trim();
  if (!q || busy) return;
  busy = true;
  const btn = $("#go");
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>检索中';
  try {
    const r = await fetch("/api/ask", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        question: q, mode: $("#mode").value, top_k: +$("#topk").value,
        company: $("#comp").value || null, no_llm: $("#nollm").checked,
        rerank: $("#rerank").checked,
        year: $("#year").value ? +$("#year").value : null,
        rtype: $("#rtype").value || null,
        route: true, per_company_k: 3,
      }),
    });
    const d = await r.json();
    $("#answerPanel").style.display = "block";
    $("#qtitle").textContent = d.question;
    const realCompanies = (d.hit_companies || []).filter(c => c && c !== "（18家汇总）");
    $("#cov").textContent = `命中 ${d.hits.length} 块 · ${realCompanies.length} 家：${realCompanies.join("、")}`;
    const rt = d.route || {};
    const rtName = { "multi-company": "跨公司（逐家检索后合并）", "single-company": "单公司", global: "全局" }[rt.route] || rt.route;
    const rtTxt = rt.route && rt.route !== "off"
      ? ` · 路由 <b>${rtName}</b>` + (rt.companies && rt.companies.length ? `（${rt.companies.length} 家${rt.per_company_k ? ` × ${rt.per_company_k} 块` : ""}）` : "")
      : "";
    const ct = d.citations;
    const ctTxt = ct ? ` · 引用 <b>${ct.summary.n_chunks_cited}</b> 块，可追溯 <b>${ct.summary.n_cited}</b> 句` +
      (ct.summary.insufficient ? ` · <span style="color:#c0392b">材料不足 ${ct.summary.n_bad} 处</span>` : "") : "";
    $("#ameta").innerHTML = `召回模式 <b>${d.mode}</b>${rtTxt} · 检索 ${d.retrieve_sec}s` + ctTxt +
      (d.generate_sec ? ` · 生成 ${d.generate_sec.toFixed(1)}s · 模型 ${d.model}` : "（未调用大模型）");
    $("#answer").innerHTML = renderAnswer(d.answer || "（未生成回答）");
    renderHits(d.hits);
  } catch (e) {
    alert("请求失败：" + e);
  } finally {
    busy = false; btn.disabled = false; btn.textContent = "提问";
  }
}

$("#go").onclick = ask;
$("#q").addEventListener("keydown", e => { if (e.key === "Enter") ask(); });
</script>
</body>
</html>
