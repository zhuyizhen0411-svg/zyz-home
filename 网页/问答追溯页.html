<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>白酒财报 RAG · 问答与出处追溯</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --line: #e3e6ea; --text: #1f2328;
    --muted: #6b7280; --accent: #2563eb; --ok: #15803d; --ok-bg: #eaf6ee;
    --bad: #b91c1c; --bad-bg: #fdebee; --neutral-bg: #f1f3f5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.65 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 24px 20px 60px; }
  header h1 { font-size: 20px; margin: 0 0 4px; }
  header .sub { color: var(--muted); font-size: 13px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 16px 18px; margin-top: 14px;
  }
  .card h2 {
    font-size: 14px; margin: 0 0 12px; color: var(--muted);
    font-weight: 600; letter-spacing: .3px;
  }
  textarea, select, input {
    font: inherit; color: var(--text); background: #fff;
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
  }
  textarea { width: 100%; min-height: 62px; resize: vertical; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
  button.primary {
    background: var(--accent); color: #fff; border: 0; border-radius: 8px;
    padding: 9px 20px; font: inherit; cursor: pointer;
  }
  button.primary:disabled { opacity: .55; cursor: default; }
  .examples { margin-top: 10px; font-size: 13px; color: var(--muted); }
  .examples span {
    display: inline-block; margin: 3px 6px 0 0; padding: 3px 9px; cursor: pointer;
    background: var(--neutral-bg); border-radius: 20px; border: 1px solid var(--line);
  }
  .examples span:hover { background: #e4e8ec; }

  .q { font-size: 17px; font-weight: 600; }
  .badge {
    display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 6px;
    background: var(--neutral-bg); color: var(--muted); border: 1px solid var(--line);
  }
  .badge.route { background: #eef2ff; color: #3730a3; border-color: #c7d2fe; font-weight: 600; }
  .badge.ok { background: var(--ok-bg); color: var(--ok); border-color: #bfe3cb; }
  .badge.bad { background: var(--bad-bg); color: var(--bad); border-color: #f3c3c9; }
  .badge.warn { background: #fff7ed; color: #b45309; border-color: #fed7aa; }
  .meta { color: var(--muted); font-size: 12.5px; margin-top: 8px; }

  .warnbar {
    background: var(--bad-bg); border: 1px solid #f3c3c9; color: var(--bad);
    border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; font-size: 13.5px;
  }
  .sent { padding: 8px 0; border-bottom: 1px dashed var(--line); }
  .sent:last-child { border-bottom: 0; }
  .sent .nums { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .num {
    font-size: 12px; padding: 2px 8px; border-radius: 6px; border: 1px solid var(--line);
    background: var(--neutral-bg); font-variant-numeric: tabular-nums;
  }
  .num.ok { background: var(--ok-bg); color: var(--ok); border-color: #bfe3cb; }
  .num.bad { background: var(--bad-bg); color: var(--bad); border-color: #f3c3c9; }
  cite {
    font-style: normal; color: var(--accent); cursor: pointer; font-weight: 600;
    padding: 0 2px; border-radius: 4px;
  }
  cite:hover { background: #eef2ff; }

  .item { border: 1px solid var(--line); border-radius: 8px; margin-bottom: 10px; overflow: hidden; }
  .item > .head {
    padding: 10px 12px; background: #fbfcfd; cursor: pointer;
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  }
  .item > .head:hover { background: #f4f6f8; }
  .item .body { padding: 12px; border-top: 1px solid var(--line); display: none; }
  .item.open .body { display: block; }
  .kv { font-size: 12.5px; color: var(--muted); }
  .kv b { color: var(--text); font-weight: 600; }
  .excerpt, .full {
    white-space: pre-wrap; word-break: break-word; font-size: 13px;
    background: #fafbfc; border: 1px solid var(--line); border-radius: 6px;
    padding: 10px; margin-top: 8px; max-height: 340px; overflow: auto;
  }
  .toggle { font-size: 12px; color: var(--accent); cursor: pointer; margin-left: auto; }
  .empty { color: var(--muted); font-size: 13.5px; }
  #err {
    margin-top: 12px; background: var(--bad-bg); border: 1px solid #f3c3c9;
    color: var(--bad); border-radius: 8px; padding: 10px 12px; font-size: 13.5px;
    white-space: pre-wrap; word-break: break-word;
  }
  .spinner {
    display: inline-block; width: 13px; height: 13px; border: 2px solid #fff;
    border-top-color: transparent; border-radius: 50%; animation: spin .8s linear infinite;
    vertical-align: -2px; margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>白酒财报 RAG · 问答与出处追溯</h1>
    <div class="sub" id="sub">加载中…</div>
  </header>

  <div class="card">
    <textarea id="q" placeholder="输入问题，回车发送（Shift+回车换行）"></textarea>
    <div class="row">
      <select id="comp"><option value="">公司（自动识别）</option></select>
      <select id="year"><option value="">年份（自动识别）</option></select>
      <select id="rtype">
        <option value="">报告类型（自动识别）</option>
        <option value="年报">年报</option>
        <option value="半年报">半年报</option>
      </select>
      <select id="topk">
        <option value="6">每家 6 块</option>
        <option value="9" selected>每家 9 块</option>
        <option value="12">每家 12 块</option>
      </select>
      <label class="kv"><input type="checkbox" id="nollm" style="vertical-align:-1px"> 只看召回</label>
      <button class="primary" id="go">提问</button>
    </div>
    <div class="examples" id="ex"></div>
    <div id="err" hidden></div>
    <div class="meta" id="apinote"></div>
  </div>

  <div id="result" hidden>
    <div class="card">
      <h2>问题</h2>
      <div class="q" id="rq"></div>
      <div class="meta" id="rmeta"></div>
    </div>

    <div class="card">
      <h2>路由</h2>
      <div id="rroute"></div>
    </div>

    <div class="card">
      <h2>答案</h2>
      <div id="warn"></div>
      <div id="rans"></div>
    </div>

    <div class="card">
      <h2>引用溯源（公司 / 年份 / 报告类型 / 页码 / 文本块编号）</h2>
      <div id="rcites"></div>
    </div>

    <div class="card">
      <h2>召回的原始文本块</h2>
      <div id="rhits"></div>
    </div>
  </div>
</div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => (s == null ? "" : String(s)).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

const EXAMPLES = [
  "贵州茅台2025年营业收入是多少？",
  "五粮液2025年末合同负债余额是多少？",
  "舍得酒业2025年白酒产量和销量分别是多少吨？",
  "贵州茅台和五粮液2025年的营业收入分别是多少？哪家更高？",
  "这12家公司2025年营业收入同比增速谁最高？",
  "山西汾酒和洋河股份2025年毛利率相比如何？",
];

const ROUTE_TEXT = {
  "single-company": "单公司",
  "multi-company": "多公司（逐家检索后合并）",
  "global": "全局",
  "off": "未启用路由",
};

let busy = false;
const chunkCache = {};

// 后端地址：默认同源；若本页是在静态预览里打开（端口不是 7860），自动指向真实服务。
// 也可用 ?api=http://host:port 手动指定。
const QS = new URLSearchParams(location.search);
const API_BASE = QS.get("api") || (location.port === "7860" ? "" : "http://127.0.0.1:7860");
$("#apinote").textContent = "后端：" + (API_BASE || "同源（" + location.origin + "）") + "　（可用 ?api= 覆盖）";

function showErr(msg) {
  const el = $("#err");
  el.hidden = false;
  el.textContent = msg;
}

/** 安全请求：先判网络、再判 HTTP 状态、再看响应体是否为空、最后才解析 JSON。 */
async function apiFetch(path, opts = {}, timeoutMs = 180000) {
  const url = API_BASE + path;
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeoutMs);
  let resp;
  try {
    resp = await fetch(url, { ...opts, signal: ctrl.signal });
  } catch (e) {
    const why = e && e.name === "AbortError" ? `请求超时（${timeoutMs / 1000}s）` : (e && e.message) || String(e);
    throw new Error(`无法连接后端 ${url}：${why}\n请确认服务已启动，或直接用 http://127.0.0.1:7860/app 打开本页。`);
  } finally {
    clearTimeout(timer);
  }
  const text = await resp.text();
  if (!resp.ok) {
    let msg = text;
    try {
      const j = JSON.parse(text);
      msg = j.error || j.detail || JSON.stringify(j);
    } catch (_) { /* 非 JSON，用原文 */ }
    throw new Error(`HTTP ${resp.status} ${resp.statusText || ""}：${msg || "空响应"}`);
  }
  if (!text || !text.trim()) {
    throw new Error(`后端返回空响应（HTTP ${resp.status}）。请确认 ${url} 指向的是后端服务，而不是静态文件服务器。`);
  }
  try {
    return JSON.parse(text);
  } catch (e) {
    throw new Error(`响应不是合法 JSON（${e.message}），前 120 字符：${text.slice(0, 120)}`);
  }
}

apiFetch("/api/stats").then(s => {
  $("#sub").textContent =
    `${s.n_companies} 家公司 · ${s.n_chunks.toLocaleString()} 个文本块 · ${s.n_docs} 份报告 · 向量 ${s.dim} 维 · 混合召回 + 出处追溯`;
  const comp = $("#comp");
  (s.companies || []).forEach(c => {
    const o = document.createElement("option"); o.value = c; o.textContent = c; comp.appendChild(o);
  });
  (s.years || []).forEach(y => {
    const o = document.createElement("option"); o.value = y; o.textContent = y + "年"; $("#year").appendChild(o);
  });
  const box = $("#ex");
  $("#err").hidden = true;
  EXAMPLES.forEach(t => {
    const el = document.createElement("span"); el.textContent = t;
    el.onclick = () => { $("#q").value = t; $("#q").focus(); };
    box.appendChild(el);
  });
}).catch(e => showErr("无法获取语料统计：" + (e && e.message ? e.message : e)));

$("#q").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ask(); }
});
$("#go").onclick = ask;

async function ask() {
  const q = $("#q").value.trim();
  if (!q || busy) return;
  busy = true;
  const btn = $("#go");
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>检索中';
  $("#err").hidden = true;
  try {
    const d = await apiFetch("/api/ask", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        question: q, mode: "hybrid", top_k: +$("#topk").value,
        company: $("#comp").value || null,
        year: $("#year").value ? +$("#year").value : null,
        rtype: $("#rtype").value || null,
        no_llm: $("#nollm").checked,
        route: true, per_company_k: 3, rerank: true,
      }),
    });
    $("#result").hidden = false;
    render(d);
  } catch (e) {
    showErr("提问失败：" + (e && e.message ? e.message : e));
  } finally {
    busy = false; btn.disabled = false; btn.textContent = "提问";
  }
}

function render(d) {
  const ct = d.citations;
  const rt = d.route || {};

  // 问题
  $("#rq").textContent = d.question;
  $("#rmeta").textContent =
    `检索 ${d.retrieve_sec}s · 生成 ${d.generate_sec ? d.generate_sec.toFixed(1) + "s" : "未调用"} · 模型 ${d.model || "—"}`;

  // 路由
  const rname = ROUTE_TEXT[rt.route] || rt.route || "—";
  const comps = rt.companies || [];
  $("#rroute").innerHTML =
    `<span class="badge route">${esc(rname)}</span> ` +
    (comps.length ? `<span class="kv">涉及 <b>${comps.length}</b> 家：${esc(comps.join("、"))}</span> ` : "") +
    (rt.per_company_k ? `<span class="kv">每家 <b>${rt.per_company_k}</b> 块</span> ` : "") +
    (rt.year ? `<span class="kv">年份 <b>${rt.year}</b></span> ` : "") +
    (rt.rtype ? `<span class="kv">类型 <b>${esc(rt.rtype)}</b></span> ` : "");

  // 答案 + 数字追溯状态
  const ansBox = $("#rans"), warnBox = $("#warn");
  warnBox.innerHTML = "";
  if (ct && ct.sentences && ct.sentences.length) {
    if (ct.summary.insufficient) {
      warnBox.innerHTML =
        `<div class="warnbar"><b>存在无法追溯的数字</b>：${ct.summary.n_bad} 句（共 ${ct.summary.n_sentences} 句）中的数字未能在所引原文块中定位，按「材料不足」处理，不予采信。</div>`;
    }
    ansBox.innerHTML = ct.sentences.map((s, i) => {
      const st = s.status;
      const badge = st === "ok" ? '<span class="badge ok">verified</span>'
        : st === "none" ? '<span class="badge">无数字</span>'
        : '<span class="badge bad">unverified</span>';
      const nums = (s.numbers || []).map(n =>
        `<span class="num ${n.matched ? "ok" : "bad"}">${esc(n.raw)}${n.matched ? "" : " ✗"}</span>`).join("");
      const cites = (s.citations || []).filter(c => c.ok)
        .map(c => `<cite data-n="${c.n}" data-id="${c.chunk_id}">[${c.n}]</cite>`).join(" ");
      return `<div class="sent">
        <div>${esc(s.text)} ${cites}</div>
        <div class="nums">${badge}${nums}</div>
      </div>`;
    }).join("");
  } else {
    ansBox.innerHTML = `<div class="sent"><div>${esc(d.answer || "（未生成回答）")}</div></div>`;
  }
  ansBox.querySelectorAll("cite").forEach(el => {
    el.onclick = () => jumpToChunk(+el.dataset.n, +el.dataset.id);
  });

  // 引用溯源
  const cbox = $("#rcites");
  if (ct && ct.citations && ct.citations.length) {
    cbox.innerHTML = ct.citations.map(c => `
      <div class="item" id="cite-${c.n}">
        <div class="head" data-id="${c.chunk_id}">
          <span class="badge">[${c.n}]</span>
          <span class="badge">块#${c.chunk_id}</span>
          <b>${esc(c.company)}</b>
          <span class="kv"><b>${c.year}</b>年</span>
          <span class="kv">${esc(c.rtype)}</span>
          <span class="kv">第 <b>${c.page}</b> 页</span>
          <span class="kv">${esc(c.section || "")}</span>
          <span class="kv">${c.block_type === "table" ? "表格" : "正文"}</span>
          <span class="toggle">查看原始文本块 ▾</span>
        </div>
        <div class="body">
          <div class="kv">原始 PDF：<b>${esc(c.pdf_path || "—")}</b>　第 ${c.page} 页</div>
          <div class="excerpt">${esc(c.excerpt)}</div>
          <div class="fullbox"></div>
        </div>
      </div>`).join("");
    bindExpand(cbox);
  } else {
    cbox.innerHTML = `<div class="empty">本次回答没有引用任何文本块${d.answer && /材料不足/.test(d.answer) ? "（模型判定材料不足）" : ""}。</div>`;
  }

  // 召回块
  const hbox = $("#rhits");
  hbox.innerHTML = (d.hits || []).map((h, i) => `
    <div class="item" id="hit-${i + 1}">
      <div class="head" data-id="${h.id}">
        <span class="badge">#${i + 1}</span>
        <span class="badge">块#${h.id}</span>
        <b>${esc(h.company)}</b>
        <span class="kv"><b>${h.year}</b>年</span>
        <span class="kv">${esc(h.rtype)}</span>
        <span class="kv">第 <b>${h.page}</b> 页</span>
        <span class="kv">${esc(h.section || "")}</span>
        <span class="kv">${h.block_type === "table" ? "表格" : "正文"}</span>
        <span class="kv">向量 ${h.vector == null ? "—" : h.vector.toFixed(3)} · BM25 ${h.bm25 == null ? "—" : h.bm25.toFixed(1)}</span>
        <span class="toggle">展开全文 ▾</span>
      </div>
      <div class="body">
        <div class="excerpt">${esc(h.text)}</div>
        <div class="fullbox"></div>
      </div>
    </div>`).join("");
  bindExpand(hbox);
}

function bindExpand(box) {
  box.querySelectorAll(".head").forEach(head => {
    head.onclick = async () => {
      const item = head.parentElement;
      item.classList.toggle("open");
      const target = item.querySelector(".fullbox");
      if (item.classList.contains("open") && !target.dataset.loaded) {
        target.textContent = "加载原文…";
        const id = head.dataset.id;
        if (chunkCache[id]) { fillFull(target, chunkCache[id]); }
        else {
          try {
            const c = await apiFetch("/api/chunk/" + id);
            chunkCache[id] = c;
            fillFull(target, c);
          } catch (e) { target.textContent = "加载失败：" + (e && e.message ? e.message : e); }
        }
      }
    };
  });
}

function fillFull(target, c) {
  if (!c || c.error) { target.textContent = "未找到该文本块"; return; }
  target.dataset.loaded = "1";
  target.innerHTML =
    `<div class="kv">块 <b>#${c.chunk_id}</b> · ${esc(c.company)}（${esc(c.code)}）· <b>${c.year}</b>年${esc(c.rtype)} · `
    + `${esc(c.section)} · 第 <b>${c.page}</b> 页 · ${c.block_type === "table" ? "表格" : "正文"} · ${c.n_chars} 字</div>`
    + `<div class="kv">原始 PDF：<b>${esc(c.pdf_path || "—")}</b>（共 ${c.pdf_pages ?? "—"} 页）</div>`
    + `<div class="kv">来源：${esc(c.source || "—")} ${esc(c.source_url || "")}</div>`
    + `<div class="full">${esc(c.text)}</div>`;
}

function jumpToChunk(n, id) {
  const el = document.getElementById("cite-" + n);
  if (!el) return;
  el.scrollIntoView({ behavior: "smooth", block: "center" });
  el.classList.add("open");
  const head = el.querySelector(".head");
  if (head) head.click();
}
</script>
</body>
</html>
